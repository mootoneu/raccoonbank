spring.application.name=cochonbank2

# Where the plain CSV files are stored. Can be an absolute or relative path.
cochonbank.data-directory=./data

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.mvc.problemdetails.enabled=true

# The frontend is a set of ES modules. Browsers must revalidate them so an
# updated app.js never runs against cached view or utility modules.
spring.web.resources.cache.cachecontrol.no-cache=true

server.port=8080
server.error.include-message=always
